name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance（供应链证明）

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "publishing version $PKG"

      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:extension
      - run: npm run build

      # trusted publishing (OIDC) 需要 npm CLI ≥ 11.5.1；Node 22 自带 10.x
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # 顺序：protocol 是 server/launcher 的依赖，必须最先发。
      # 认证走 OIDC trusted publishing：npmjs.com 各包 Settings → Trusted publishing
      # 配置本仓库（hcfw007/chrome-in-harness）+ workflow 文件名 publish.yml，
      # 并勾选 Allow npm publish（默认仅允许 stage publish）。无需 NPM_TOKEN。
      # 公开仓库下 provenance 自动生成，无需 --provenance。
      - name: Publish @chrome-in-harness/protocol
        run: npm publish --workspace @chrome-in-harness/protocol --access public
      - name: Publish @chrome-in-harness/server
        run: npm publish --workspace @chrome-in-harness/server --access public
      - name: Publish @chrome-in-harness/launcher
        run: npm publish --workspace @chrome-in-harness/launcher --access public

  release:
    runs-on: ubuntu-latest
    needs: [npm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @chrome-in-harness/protocol
      - run: npm run zip -w @chrome-in-harness/extension
      - name: Collect extension zip
        run: |
          mkdir -p dist-release
          cp packages/extension/.output/chrome-in-harness-*.zip dist-release/chrome-in-harness-extension.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/chrome-in-harness-extension.zip
          generate_release_notes: true
